name: 3D Isometric Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-isocalendar
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # Leaving base empty removes all the default extra stats/headers
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
